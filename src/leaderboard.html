<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="leaderboard.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="web_Icon.svg">

    <title>Leaderboard</title>
    <script>
        async function makeRequest() {
            try {
                function getApiBase() {
                    const host = window.location.hostname;
                    const parts = host.split('.');
                    const len = parts.length;
                    let root = len > 2 ? parts.slice(len - 2).join('.') : host;
                    if (root == "localhost") {
                        root = "localhost:8080"
                    }
                    return window.location.protocol + '//' + root + "/api";
                }

                const response = await fetch(getApiBase() + '/leaderboard');
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                const data = await response.text();
                return data;
            } catch (error) {
                console.error('Error:', error);
                return null;
            }
        }

        async function displayLeaderboard() {
            const data = await makeRequest();
            if (data) {
                try {
                    const leaderboard = JSON.parse(data);
                    const elements = ['plek_een', 'plek_twee', 'plek_drie'];
                    for (let i = 0; i < 3; i++) {
                        const el = document.getElementById(elements[i]);
                        if (el && leaderboard[i]) {
                            el.innerHTML += " " + leaderboard[i].username + " " + leaderboard[i].user_score + " punten" + '<img src="bages/' + (leaderboard[i].bage || 0) + '.png" class="medalie" alt="">';
                        }
                    }

                    const deRestEl = document.getElementById('de_rest');
                    if (deRestEl && leaderboard.length > 3) {
                        for (let i = 3; i < leaderboard.length; i++) {
                            if (leaderboard[i] && leaderboard[i].user_score > 0) {
                                deRestEl.innerHTML += (deRestEl.innerHTML ? "<br>" : "") + leaderboard[i].username + " " + leaderboard[i].user_score + " punten" + '<img src="bages/' + (leaderboard[i].bage || 0) + '.png" class="medalie" alt="">';
                            }
                        }
                    }
                } catch (e) {
                    console.error("Error rendering leaderboard:", e);
                }
            } else {
                document.getElementById('container').innerHTML = ' server offline )=';
            }
        }
        displayLeaderboard();
    </script>
</head>

<body class="Abody">
    <a href="index.html" class="Aa">terug</a>
    <div class="logo"><img src="logo.png" alt="">
    </div>
    <div class="Acontainercontainer">
        <div id="container" class="Acontainer">
            <p>Stad</p>
            <div>
                <p id="plek_een" class="Ap"><img src="afbeeldingen/GoldMedal.png" class="medalie" alt="">
                </p>
            </div>
            <div>

                <p id="plek_twee" class="Ap"> <img src="afbeeldingen/SilverMedal.png" class="medalie" alt="">
                </p>
            </div>
            <div>
                <p id="plek_drie" class="Ap"> <img src="afbeeldingen/BronzeMedal.png" class="medalie" alt="">
                </p>
            </div>
            <div id="de_rest" class="Ap"></div>
        </div>
    </div>
</body>

</html>
